[project]
name = "pbca"
version = "0.1.0"
description = "Policy-Bounded Continuous Authorization for Zero Trust IAM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "httpx>=0.27"]
shap = ["shap>=0.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pbca*"]

[tool.setuptools.package-data]
"pbca.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
